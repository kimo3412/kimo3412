<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links | GIRIMI</title>

    <!-- SEO Meta Tags -->
    <meta name="description" content="Find all of GIRIMI's social links and contact information in one place.">
    <meta property="og:title" content="Links | GIRIMI">
    <meta property="og:description" content="Connect with GIRIMI - All links in one place.">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#fdf2f8', 100: '#fce7f3', 500: '#ec4899', 600: '#db2777', 700: '#be185d',
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Noto Sans SC', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Shared Styles -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- GSAP for Smooth Animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>

<body class="text-slate-800 dark:text-slate-200 transition-colors duration-700 antialiased">

    <!-- Custom Cursor Elements -->
    <div class="cursor-core"></div>
    <div class="cursor-aura"></div>

    <!-- Mesh Background -->
    <div class="mesh-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- Main Content -->
    <main class="min-h-screen flex flex-col items-center justify-center px-6 py-16">

        <!-- Profile Section -->
        <div class="text-center mb-12 reveal">
            <!-- Avatar -->
            <div
                class="w-28 h-28 mx-auto mb-6 rounded-full bg-gradient-to-br from-pink-400 to-rose-600 flex items-center justify-center text-white text-4xl font-bold shadow-xl shadow-pink-500/30">
                G
            </div>

            <h1 class="text-3xl font-bold mb-2">GIRIMI</h1>
            <p class="text-slate-500 dark:text-slate-400 text-sm max-w-xs mx-auto">
                Creative Developer · 软件工程在读
            </p>

            <!-- Theme Toggle -->
            <button id="theme-toggle"
                class="magnetic mt-6 p-3 rounded-full border border-slate-200 dark:border-slate-700 bg-white/30 dark:bg-zinc-800/30 backdrop-blur-md hover:bg-slate-100 dark:hover:bg-slate-800 transition-all text-slate-500 dark:text-slate-400">
                <i data-lucide="moon" class="w-5 h-5"></i>
            </button>
        </div>

        <!-- Links Section -->
        <div class="w-full max-w-md space-y-4">

            <!-- Portfolio Link -->
            <a href="index.html"
                class="magnetic link-card reveal glass-panel block w-full p-5 rounded-2xl text-center font-semibold hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-3"
                style="transition-delay: 0.1s;">
                <i data-lucide="home" class="w-5 h-5 text-primary-500"></i>
                <span>个人主页 / Portfolio</span>
            </a>

            <!-- GitHub Link -->
            <a href="https://github.com/kimo3412" target="_blank"
                class="magnetic link-card reveal glass-panel block w-full p-5 rounded-2xl text-center font-semibold hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-3"
                style="transition-delay: 0.15s;">
                <i data-lucide="github" class="w-5 h-5 text-slate-700 dark:text-white"></i>
                <span>GitHub</span>
            </a>

            <!-- Email Link -->
            <a href="mailto:shanrzkimo@outlook.com"
                class="magnetic link-card reveal glass-panel block w-full p-5 rounded-2xl text-center font-semibold hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-3"
                style="transition-delay: 0.2s;">
                <i data-lucide="mail" class="w-5 h-5 text-blue-500"></i>
                <span>Email 邮件</span>
            </a>

            <!-- Blog Link -->
            <a href="blog/index.html"
                class="link-card reveal glass-panel block w-full p-5 rounded-2xl text-center font-semibold hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-3"
                style="transition-delay: 0.25s;">
                <i data-lucide="book-open" class="w-5 h-5 text-purple-500"></i>
                <span>博客 / Blog</span>
            </a>

            <!-- Divider -->
            <div class="reveal flex items-center gap-4 py-4" style="transition-delay: 0.3s;">
                <div class="flex-1 h-px bg-slate-200 dark:bg-slate-700"></div>
                <span class="text-xs text-slate-400 dark:text-slate-500 font-medium">实用工具</span>
                <div class="flex-1 h-px bg-slate-200 dark:bg-slate-700"></div>
            </div>

            <!-- ===== 实用工具区域 - 在这里添加更多链接 ===== -->

            <!-- 示例: ChatGPT -->
            <a href="https://chat.openai.com" target="_blank"
                class="link-card reveal glass-panel block w-full p-5 rounded-2xl text-center font-semibold hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-3"
                style="transition-delay: 0.35s;">
                <i data-lucide="bot" class="w-5 h-5 text-green-500"></i>
                <span>ChatGPT</span>
            </a>

            <!-- 示例: 在线工具 -->
            <a href="https://tool.lu" target="_blank"
                class="link-card reveal glass-panel block w-full p-5 rounded-2xl text-center font-semibold hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-3"
                style="transition-delay: 0.4s;">
                <i data-lucide="wrench" class="w-5 h-5 text-orange-500"></i>
                <span>在线工具箱</span>
            </a>
            <!-- 示例: 在线工具 -->
            <a href="https://yinghuadm.cn/" target="_blank"
                class="link-card reveal glass-panel block w-full p-5 rounded-2xl text-center font-semibold hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-3"
                style="transition-delay: 0.45s;">
                <i data-lucide="tv" class="w-5 h-5 text-pink-400"></i>
                <span>樱花动漫</span>
            </a>

            <!-- 
            ===== 如何添加更多链接 =====
            复制下面的模板，修改 href, icon, 和文字即可：
            
            <a href="你的链接" target="_blank"
                class="link-card reveal glass-panel block w-full p-5 rounded-2xl text-center font-semibold hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-3"
                style="transition-delay: 0.45s;">
                <i data-lucide="图标名称" class="w-5 h-5 text-颜色-500"></i>
                <span>链接名称</span>
            </a>
            
            图标列表: https://lucide.dev/icons
            -->

        </div>

        <!-- Footer -->
        <footer class="mt-16 text-center text-slate-400 dark:text-slate-600 text-xs font-mono reveal"
            style="transition-delay: 0.3s;">
            <p>&copy; 2025 GIRIMI</p>
        </footer>

    </main>

    <!-- Shared JavaScript -->
    <script src="js/main.js"></script>
</body>

</html>
